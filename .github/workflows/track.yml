name: track

on:
  schedule:
    # Every 6 hours. With 8 origins that is 32 API calls a day, roughly 960 a
    # month, which sits inside the Amadeus free tier. Raising the frequency or
    # the origin count multiplies both numbers.
    - cron: "0 */6 * * *"
  workflow_dispatch:      # manual "run now" button
    inputs:
      dry_run:
        description: "Print alerts instead of posting them"
        type: boolean
        default: false

permissions:
  contents: write         # to commit flights.db back

# flights.db is the whole memory of the bot. Two overlapping runs would both
# write it and one would lose, so runs are serialised rather than cancelled.
concurrency:
  group: track
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.deps
          key: deps-ubuntu-gcc-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: deps-ubuntu-gcc-

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
                -DFETCHCONTENT_BASE_DIR="$PWD/.deps"
          cmake --build build -j 4

      - name: Check prices
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          AMADEUS_CLIENT_ID:   ${{ secrets.AMADEUS_CLIENT_ID }}
          AMADEUS_SECRET:      ${{ secrets.AMADEUS_SECRET }}
        run: |
          # Without credentials the tracker falls back to its mock payload,
          # which would write nonsense into the real price history. Better to
          # say so plainly than to record fiction.
          if [ -z "$AMADEUS_CLIENT_ID" ]; then
            echo "::warning::AMADEUS_CLIENT_ID is not set; skipping the sweep"
            exit 0
          fi
          build/bin/flight_tracker --once ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Persist price history
        run: |
          git config user.name  "flight-tracker[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # flights.db is gitignored for local development, so -f is required.
          git add -f flights.db 2>/dev/null || exit 0
          # Only commit when something actually changed, so a quiet sweep does
          # not produce an empty commit every six hours.
          if git diff --quiet --cached; then
            echo "no price changes this sweep"
            exit 0
          fi
          git commit -m "price history $(date -u '+%Y-%m-%d %H:%M') UTC"
          # A push can lose a race with a concurrent run; rebase and retry once.
          git push || { git pull --rebase && git push; }
