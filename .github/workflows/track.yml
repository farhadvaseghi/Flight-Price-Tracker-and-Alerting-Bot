name: track

on:
  schedule:
    # Every 4 hours: 6 sweeps a day. With 11 origins and up to 5 pages each
    # that is at most 55 requests a sweep, paced 250ms apart, so about 330 a
    # day against a free undocumented endpoint that owes us nothing.
    #
    # 4 rather than the 3 that was asked for, deliberately. Fares on a 90-day
    # window do not move on a 3-hour timescale, so the extra daily sweep buys
    # almost no freshness and costs a third more requests on the one source
    # the whole project depends on. Change to "0 */3 * * *" for 3-hourly if the
    # responsiveness turns out to matter.
    - cron: "0 */4 * * *"
  workflow_dispatch:      # manual "run now" button
    inputs:
      dry_run:
        description: "Print alerts instead of posting them"
        type: boolean
        default: false

permissions:
  contents: write         # to commit flights.db back

# flights.db is the whole memory of the bot. Two overlapping runs would both
# write it and one would lose, so runs are serialised rather than cancelled.
concurrency:
  group: track
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.deps
          key: deps-ubuntu-gcc-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: deps-ubuntu-gcc-

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
                -DFETCHCONTENT_BASE_DIR="$PWD/.deps"
          cmake --build build -j 4

      - name: Check prices
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # The fare API needs no credential, so the sweep can always run and
          # build price history. Only the alerting needs secrets -- without them
          # a new low would be found and then silently dropped, so say so.
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::Telegram secrets are not set; recording prices but not alerting"
          fi
          build/bin/flight_tracker --once ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Persist price history
        run: |
          git config user.name  "flight-tracker[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # flights.db is gitignored for local development, so -f is required.
          git add -f flights.db 2>/dev/null || exit 0
          # Only commit when something actually changed, so a quiet sweep does
          # not produce an empty commit every six hours.
          if git diff --quiet --cached; then
            echo "no price changes this sweep"
            exit 0
          fi
          git commit -m "price history $(date -u '+%Y-%m-%d %H:%M') UTC"
          # A push can lose a race with a concurrent run; rebase and retry once.
          git push || { git pull --rebase && git push; }
