name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      # Report every platform's result, rather than cancelling the rest as
      # soon as one fails.
      fail-fast: false
      matrix:
        include:
          - name: windows-msvc
            os: windows-latest
            # No -G here on purpose. Pinning "Visual Studio 17 2022" breaks the
            # moment GitHub moves windows-latest to an image with a newer
            # Visual Studio, which is exactly how this job first failed:
            # "could not find any instance of Visual Studio". Letting CMake
            # pick the installed generator survives those image bumps.
            configure: -DCMAKE_BUILD_TYPE=Release
            build: --config Release
            binary: build/bin/flight_tracker.exe
          - name: ubuntu-gcc
            os: ubuntu-latest
            configure: -DCMAKE_BUILD_TYPE=Release
            build: -j 4
            binary: build/bin/flight_tracker

    steps:
      - uses: actions/checkout@v4

      # cpr, libcurl, zlib, nlohmann/json and the SQLite amalgamation are all
      # fetched and compiled from source, which dominates the build time. They
      # only change when CMakeLists.txt pins a different version, so key the
      # cache on that file and keep them out of the build tree so a wiped
      # build/ does not take them with it.
      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.deps
          key: deps-${{ matrix.name }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: deps-${{ matrix.name }}-

      - name: Configure
        shell: bash
        run: |
          # github.workspace is a backslash path on Windows; cygpath turns it
          # into the D:/... form CMake wants. Plain $PWD would be an MSYS path
          # that CMake cannot resolve.
          if command -v cygpath >/dev/null 2>&1; then
            deps="$(cygpath -m "$PWD")/.deps"
          else
            deps="$PWD/.deps"
          fi
          echo "FETCHCONTENT_BASE_DIR=$deps"

          set +e
          cmake -S . -B build ${{ matrix.configure }} \
                -DFETCHCONTENT_BASE_DIR="$deps" 2>&1 | tee configure.log
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -ne 0 ]; then
            # Job logs need repo admin rights to download, but annotations are
            # readable by anyone, so put the actual reason where it can be seen.
            grep -iE "error|Could NOT find|does not (exist|match)" configure.log \
              | tail -8 | while IFS= read -r line; do echo "::error::$line"; done
            exit "$status"
          fi

          # Record what CMake actually chose, so a future image bump is
          # obvious in the log rather than a mystery.
          grep -E "^CMAKE_(GENERATOR|CXX_COMPILER):" build/CMakeCache.txt || true

      - name: Build
        shell: bash
        run: |
          set +e
          cmake --build build ${{ matrix.build }} 2>&1 | tee compile.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            grep -iE "error" compile.log | tail -8 \
              | while IFS= read -r line; do echo "::error::$line"; done
            exit "$status"
          fi

      # A binary that links is not the same as a binary that runs. --dry-run
      # and --mock keep this fully offline: no Telegram, no fare API, no network.
      - name: Smoke test
        shell: bash
        run: |
          ${{ matrix.binary }} --help

          # --mock is essential: CI must not depend on a live third-party
          # endpoint. One origin keeps the counts stable when the default origin
          # list changes. The mock payload holds five fares: two usable (Malaga
          # under the cap, Athens over it), one outside the region, one with no
          # price and one with no arrival airport.
          output=$(${{ matrix.binary }} --once --dry-run --mock --origins=CGN)
          echo "$output"

          expected="1 calls, 2 offers, 1 filtered, 2 malformed, 1 under cap, 0 alerts"
          echo "$output" | grep -q "$expected" \
            || { echo "::error::sweep result changed; expected: $expected"; exit 1; }

          # Region filtering is the piece with no other coverage, so assert the
          # airport table actually loaded rather than silently coming up empty.
          echo "$output" | grep -qE "region   : [0-9]+ countries" \
            || { echo "::error::region allowlist did not load"; exit 1; }

          # The mock includes a Moroccan destination purely to prove the region
          # filter fires. If this line disappears, the filter has stopped working
          # and non-European destinations would flow through to alerts.
          echo "$output" | grep -q "outside region: Morocco" \
            || { echo "::error::region filter did not reject Morocco"; exit 1; }

          echo "$output" | grep -q "shutting down cleanly" \
            || { echo "::error::did not shut down cleanly"; exit 1; }

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: flight_tracker-${{ matrix.name }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
